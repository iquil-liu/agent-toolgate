name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 构建检索索引
        run: python3 -m src.kb.cli rebuild

      - name: 单元测试
        run: python3 -m unittest discover -s tests -v

      - name: 零第三方依赖复跑
        run: python3 -S -m unittest discover -s tests -v

      - name: MCP 演示（工具列表与真实检索调用）
        run: python3 -m src.mcp_server --demo

      - name: 混合检索评测（Recall@5 低于 0.80 则失败）
        run: python3 eval/run_eval.py --hybrid

      - name: 观测面板
        run: python3 -m src.observability
